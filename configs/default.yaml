# CrossVul-DG default configuration
# Override at the CLI via --override key=value  (e.g. --override train.epochs=5)

encoder:
  name: microsoft/codebert-base
  revision: 3b0952feddeffad0063f274080e3c23d75e7eb39
  max_length: 512
  hidden_size: 768
  dropout: 0.1

train:
  batch_size: 2
  lr: 2.0e-5
  weight_decay: 1.0e-2
  epochs: 10
  warmup_steps: 500
  grad_clip: 1.0
  early_stopping_patience: 3
  num_workers: 0
  monitor: pr_auc
  checkpoint_path: null
  resume: true
  device: cpu

eval:
  batch_size: 2
irm:
  lambda_max: 10.0
  warmup_epochs: 1

dro:                      # project-level GroupDRO baseline
  eta_q: 0.01

cc_dro:                   # proposed: class-conditional DRO + positive-class invariance
  eta_q: 0.01             # exp-gradient LR over (project x class) cells
  lambda_inv: 1.0         # weight of the cross-project positive-risk variance penalty
  warmup_epochs: 1        # ramp lambda_inv after this many epochs
  balanced_batches: true  # ensure every project batch contains both classes
  use_pos_weight: false   # cells already correct class imbalance; avoid double weighting

da:                       # domain-adaptation baselines (use UNLABELLED target)
  coral_weight: 1.0
  dann_lambda: 0.1
  target_ratio: 0.5       # earlier fraction of held-out project used as DA target; later = test

pseudo:
  n_clusters: 5
  embedding_subset: 1024  # max samples per tail project used for the mean embedding

data:
  top_k: 10
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  dedup: true             # drop functions whose hash collides
