# Colab/Kaggle-friendly configuration.
# Keeps the learning protocol from default.yaml, but reduces GPU memory use.

encoder:
  name: microsoft/codebert-base
  max_length: 256
  hidden_size: 768
  dropout: 0.1

train:
  batch_size: 2
  lr: 2.0e-5
  weight_decay: 1.0e-2
  epochs: 10
  warmup_steps: 500
  grad_clip: 1.0
  early_stopping_patience: 3
  num_workers: 0
  monitor: pr_auc
  checkpoint_path: null
  resume: true

eval:
  batch_size: 8

irm:
  lambda_max: 10.0
  warmup_epochs: 1

dro:
  eta_q: 0.01

cc_dro:
  eta_q: 0.01
  lambda_inv: 1.0
  warmup_epochs: 1
  balanced_batches: true
  use_pos_weight: false

da:
  coral_weight: 1.0
  dann_lambda: 0.1
  target_ratio: 0.5

pseudo:
  n_clusters: 5
  embedding_subset: 512

data:
  top_k: 10
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  dedup: true
